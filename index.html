<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>HVAC Hub 운영</title>
<style>
  body{margin:0;background:#F7F8F9;color:#172B4D;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  .gate{max-width:420px;margin:18vh auto 0;padding:24px;background:#fff;border:1px solid #091E4224;border-radius:8px;box-shadow:0 1px 1px #091E4240}
  .gate h1{margin:0 0 6px;font-size:18px}
  .gate p{margin:0 0 14px;color:#44546F}
  .gate input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #091E4224;border-radius:4px;font:inherit}
  .gate button{margin-top:10px;padding:8px 14px;border:0;border-radius:4px;background:#0C66E4;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .gate .msg{margin-top:10px;color:#C9372C;min-height:1.5em}
  [hidden]{display:none}
</style>
</head>
<body>
<div class="gate">
  <h1>HVAC Hub 운영</h1>
  <p id="state">불러오는 중…</p>
  <form id="form" hidden>
    <input id="inp" type="text" autocomplete="off" spellcheck="false" placeholder="접근 링크 전체 또는 접근 키 붙여넣기" aria-label="접근 링크 또는 접근 키">
    <button type="submit">열기</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
</div>
<script>
(function () {
  var LS = 'hvachhsite_key';
  var $ = function (id) { return document.getElementById(id); };
  var lsGet = function () { try { return localStorage.getItem(LS); } catch (e) { return null; } };
  var lsSet = function (v) { try { localStorage.setItem(LS, v); } catch (e) {} };
  var lsDel = function () { try { localStorage.removeItem(LS); } catch (e) {} };
  var b64 = function (s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
  /* 붙여넣은 값이 링크 전체여도, 키만이어도 받는다 */
  var pick = function (s) { var m = /(?:[#&]k=)?([A-Za-z0-9_-]{43})\s*$/.exec(String(s || '').trim()); return m ? m[1] : null; };

  async function decrypt(name, k) {
    var gz = 'DecompressionStream' in window;
    var res = await fetch(name + (gz ? '.gz' : '') + '.enc', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var buf = new Uint8Array(await res.arrayBuffer());
    var key = await crypto.subtle.importKey('raw', b64(k), 'AES-GCM', false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.subarray(0, 12) }, key, buf.subarray(12));
    if (gz) pt = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    return new TextDecoder().decode(pt);
  }

  function ask(text) {
    $('state').textContent = '접근 링크로 한 번 열면 이 기기에서는 다음부터 바로 열립니다.';
    $('form').hidden = false; $('msg').textContent = text || ''; $('inp').focus();
  }

  async function open(k, fromInput) {
    var html;
    try { html = await decrypt('app', k); }
    catch (e) {
      var net = /HTTP|fetch|network/i.test(String(e && e.message));
      if (!net) lsDel();
      ask(net ? '불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.' : (fromInput ? '키가 맞지 않습니다.' : '저장된 키가 맞지 않습니다. 접근 링크로 다시 열어 주세요.'));
      return;
    }
    lsSet(k);
    document.open(); document.write(html.replace('"__HH_KEY__"', function () { return JSON.stringify(k); })); document.close();
  }

  if (!(window.crypto && crypto.subtle)) { $('state').textContent = '이 브라우저에서는 열 수 없습니다(https 로 접속해 주세요).'; return; }
  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault(); var k = pick($('inp').value);
    if (!k) { $('msg').textContent = '접근 링크 또는 키 형식이 아닙니다.'; return; }
    $('msg').textContent = ''; open(k, true);
  });

  /* 주소의 #k=… 는 읽은 뒤 바로 지운다(주소창·기록에 키가 남지 않게) */
  var fromHash = function () {
    var m = /^#k=([A-Za-z0-9_-]{43})$/.exec(location.hash);
    if (m) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    return m ? m[1] : null;
  };
  /* 잠금 화면이 떠 있는 상태에서 주소창에 접근 링크를 붙여넣은 경우(새로고침 없이 # 뒤만 바뀜) */
  window.addEventListener('hashchange', function () { var k = fromHash(); if (k) open(k, false); });
  var k = fromHash() || lsGet();
  if (k) open(k, false); else ask('');
})();
</script>
</body>
</html>
